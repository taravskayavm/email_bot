name: EmailBot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check syntax
        run: |
          python -m compileall -q emailbot bot utils services pipelines crawler parser mailer
          ruff check emailbot bot utils services pipelines crawler parser mailer email_bot.py --select E9,F63,F7,F82

      - name: Run complete test suite
        run: |
          pytest -q tests
        env:
          EMAIL_ADDRESS: test@example.test
          EMAIL_PASSWORD: test-only
          TELEGRAM_BOT_TOKEN: 123456:offline-test-token
          APPEND_TO_SENT: '0'
          SMTP_MAX_PER_MIN: '0'
          SMTP_MAX_PER_HOUR: '0'

      - name: Verify exports
        run: |
          python tools/check_email_clean_exports.py
